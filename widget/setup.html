<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>트리 위젯 설정</title>
<style>
body{margin:0;font:15px/1.5 "Malgun Gothic",system-ui,sans-serif;background:#0c241c;color:#f7fbff;padding:24px}
h1{font-size:20px;margin:0 0 6px}
p{margin:0 0 14px;color:#cfe3da;font-size:14px}
input{width:100%;box-sizing:border-box;font-size:15px;padding:10px 12px;border-radius:10px;border:2px solid #2e5b4a;background:#fff;color:#13241e}
input:focus{outline:3px solid #f3c34d}
button{margin-top:12px;width:100%;height:44px;border:0;border-radius:10px;background:#d8323e;color:#fff;font-size:16px;cursor:pointer}
#err{color:#ffb4b9;font-size:13px;min-height:18px;margin-top:6px}
</style>
</head>
<body>
<h1>트리 웹사이트 주소</h1>
<p>GitHub Pages에 올린 트리 사이트 주소를 붙여넣어 주세요.<br>예: https://아이디.github.io/my-tree/</p>
<form id="f">
  <input id="u" placeholder="https://" autofocus spellcheck="false">
  <div id="err"></div>
  <button type="submit">저장하고 트리 띄우기</button>
</form>
<script>
const u = document.getElementById("u");
u.value = new URLSearchParams(location.search).get("url") || "";
document.getElementById("f").addEventListener("submit", async (e) => {
  e.preventDefault();
  document.getElementById("err").textContent = await window.tree.save(u.value);
});
</script>
</body>
</html>
